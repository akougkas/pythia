# Ares cluster — single source of truth for hpc_cg_multi.
# Sourced from: https://grc.iit.edu/docs/ares/ares-user-guide
# Companion files in this directory:
#   - storage_decision_guide.md   (storage-tier selection)
#   - slurm_usage.md              (scheduler + hostname routing)
# Consumers: planner agent (reads via Read/Grep at plan time).

cluster: ares
description: |
  IIT/SCS Ares cluster. One rack: 1 master node + 32 compute nodes.
  All compute nodes share a 48 TB RAID-5 storage pool; the high-speed
  fabric is 40 Gbps Ethernet with RoCE, with TCP as the documented fallback.

# ─────────────────────────────────────────────────────────────
# Master / login node
# ─────────────────────────────────────────────────────────────
master:
  model: ThinkSystem SR650
  count: 1
  hostname: ares.cs.iit.edu          # IP 216.47.152.168
  cpu:
    model: Xeon Silver 4114
    sockets_per_node: 2
    cores_per_socket: 10
    threads_per_core: 2
    base_ghz: 2.2
    boost_ghz: 3.0
  memory_gb: 96
  memory_type: DDR4-2400
  storage:
    - role: os
      capacity_gb: 128
      type: M.2 SSD
  role: login + light admin only — NOT a compute node

# ─────────────────────────────────────────────────────────────
# Compute nodes (32×)
# ─────────────────────────────────────────────────────────────
compute:
  model: ThinkSystem SR630
  count: 32
  hostname_pattern:
    low_speed: "ares-comp-[01-32]"        # routed via 10 GbE (default)
    high_speed: "ares-comp-[01-32]-40g"   # routed via 40 GbE (RoCE-capable)
    note: >
      The same physical nodes are reachable under either name. Picking the
      -40g hostname in the Slurm nodelist routes traffic over the RoCE
      fabric; the unsuffixed name uses the 10 GbE default fabric.
  cpu:
    model: Xeon Silver 4114
    sockets_per_node: 2
    cores_per_socket: 10
    threads_per_core: 2
    base_ghz: 2.2
    boost_ghz: 3.0
  memory_gb: 48
  memory_type: DDR4-2400
  storage:
    - role: os
      capacity_gb: 32
      type: M.2 SSD
  scratch_tiers:
    - name: samsung_960_evo
      capacity_gb: 250
      type: M.2 NVMe
      mount: /mnt/nvme/$USER
      node_range: "compute-[001-024]"
      node_count: 24
    - name: toshiba_rd400
      capacity_gb: 256
      type: M.2 NVMe
      mount: /mnt/nvme/$USER
      node_range: "compute-[025-032]"
      node_count: 8
    - name: samsung_860_evo
      capacity_gb: 512
      type: SATA SSD
      mount: /mnt/ssd/$USER
      node_count: 32
    - name: seagate_lm049
      capacity_gb: 1000
      type: SATA HDD
      mount: /mnt/hdd/$USER
      node_count: 32

# ─────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────
fabric:
  type: ethernet
  speed_gbps: 40
  rdma: roce
  nic: Mellanox ConnectX-4 Lx 1x40GbE QSFP
  default_speed_gbps: 10              # 10 GbE if -40g hostname not used
  notes: >
    RoCE availability must be verified at discovery time
    (ucx_info -d, ibstat). Default fabric falls back to TCP when
    the unsuffixed (10 GbE) hostnames are used.

# ─────────────────────────────────────────────────────────────
# Filesystems
# ─────────────────────────────────────────────────────────────
shared_filesystem:
  type: raid5
  capacity_tb: 48
  drives:
    count: 8
    capacity_tb: 8
    rpm: 7200
    interface: SAS
  mounts:
    - path: /home/$USER
      use: small files, scripts, configs
    - path: /mnt/common/$USER
      use: shared bulk data, source repos, final results
  notes: >
    Sequential writes are parity-amplified. Large intermediate writes
    (>10 GB) should be staged to compute-scratch NVMe; final results
    may be committed here.

storage_paths:
  home: /home/$USER                   # small files only; backed by RAID-5
  shared_bulk: /mnt/common/$USER      # 48 TB shared RAID-5 pool
  node_nvme: /mnt/nvme/$USER          # fastest, 250–256 GB, per-node
  node_ssd: /mnt/ssd/$USER            # 512 GB SATA, per-node
  node_hdd: /mnt/hdd/$USER            # 1 TB SATA, per-node

# ─────────────────────────────────────────────────────────────
# Scheduler (SLURM)
# ─────────────────────────────────────────────────────────────
scheduler:
  type: slurm
  walltime_max_hours: 48
  priority_policy: fcfs               # first-come-first-served, no user override
  notes: >
    Submit with sbatch; allocate interactively with salloc -N ... --exclusive
    -w <nodelist>. Example #SBATCH directives in slurm_usage.md.

# ─────────────────────────────────────────────────────────────
# Software stack
# ─────────────────────────────────────────────────────────────
software:
  module_system: lmod                 # use `module avail`, `module load`
  custom_installs: spack-supported    # users may install via spack
  enumerated_modules_available: false # compiler/MPI list not snapshotted
  notes: >
    The exact set of available modules is not captured in this snapshot;
    `module avail` must be run on the login node to see the full list.
    Specific compiler/MPI versions referenced in a plan must be flagged as
    "load-time-verified" — do not invent version numbers.

# ─────────────────────────────────────────────────────────────
# Access policy
# ─────────────────────────────────────────────────────────────
access:
  protocol: ssh
  port: 22
  authentication: ssh-key             # password auth disabled
  network: iit-network-or-iit-vpn
  sudo_policy: cache-clear and orangefs only
  master_role: >
    Login + light tasks (file edits, sbatch submission, downloads <few GB).
    Heavy computation must run on compute nodes via Slurm.

# ─────────────────────────────────────────────────────────────
# Operational notes (constraints the plan must respect)
# ─────────────────────────────────────────────────────────────
operational_notes:
  - id: thermal_throttle
    text: >
      All-core boost (3.0 GHz) is not sustained under thermal load.
      Expect roughly 2.4 GHz under sustained AVX-2 workloads.
  - id: master_role
    text: >
      Master node has 96 GB RAM and can host serial pre- or
      post-processing or data marshalling, but its scratch is OS-only —
      bulk data must live on compute-scratch tiers or shared FS.
  - id: per_compute_node_ceiling
    text: >
      Per compute node ceiling: 20 cores / 40 threads, 48 GB DDR4-2400.
      Fully packing 20 ranks/node leaves only 2.4 GB/rank, usually too
      tight without hybrid MPI+OpenMP.
  - id: roce_verify
    text: >
      RoCE is supported but not guaranteed at runtime; default fabric
      falls back to TCP. Verify with ucx_info -d / ibstat before
      relying on UCX_TLS=rc,sm,self.
  - id: storage_tier_split
    text: >
      The 24/8 split of compute scratch (Samsung 960 Evo vs.
      Toshiba RD400) is heterogeneous in both vendor and capacity.
      Placement decisions for I/O-heavy stages should pick a tier
      explicitly and justify based on capacity and vendor IOPS profile.
  - id: fcfs_priority
    text: >
      Slurm priority is FCFS with no user-side adjustment. For
      time-sensitive runs, coordinate with current users rather than
      relying on a priority knob.
  - id: walltime_cap
    text: >
      48-hour walltime cap per job. Long studies must be checkpointed
      and resumed across multiple jobs.
