[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
# Phase 4 (plan §D): zero-shot semantic intent detector. Optional so the
# rule-based and LLM detectors don't require the heavy torch/transformers stack.
ml = [
    "sentence-transformers>=2.7",
    "torch>=2.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (latency budget, model loads)",
]

[tool.setuptools.packages.find]
where = ["."]
